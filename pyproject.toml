[project]
name = "taleboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "boto3",
    "together",
    "rembg[cpu]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real AWS Bedrock (slow, costs money, needs credentials)",
]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest", "python-dotenv", "moto[dynamodb,s3]"]